<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gacha Waifu mu</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffd9ea; --dot:#ffc0dc; --text:#7a1f4d; --muted:#b0577f;
  --pink:#ff8cc2; --pink2:#ff5fa8; --blue:#4aa8f0; --yellow:#ffd84d;
  --card:#fff; --border:#ff9fcb; --shadow:rgba(255,95,168,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2b1224; --dot:#3a1830; --text:#ffd6ea; --muted:#d08fb0;
    --pink:#e0629f; --pink2:#c43f84; --card:#3a1b31; --border:#a8467a; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#2b1224; --dot:#3a1830; --text:#ffd6ea; --muted:#d08fb0;
  --pink:#e0629f; --pink2:#c43f84; --card:#3a1b31; --border:#a8467a; --shadow:rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Poppins","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(var(--dot) 18%,transparent 19%) 0 0/28px 28px, var(--bg);
  display:flex; flex-direction:column; align-items:center; padding:26px 16px 40px;
}
h1{margin:0; font-size:clamp(1.8rem,7vw,2.9rem); text-align:center; color:#fff;
  -webkit-text-stroke:0; text-shadow:0 3px 0 var(--pink2),0 6px 0 var(--pink2),0 10px 14px var(--shadow);
  letter-spacing:1px}
.cube{display:inline-block; width:.55em; height:.55em; background:var(--blue); border-radius:4px;
  transform:rotate(20deg); margin:0 8px; box-shadow:0 2px 0 #2b7dc0; vertical-align:middle; animation:spin 4s linear infinite}
.cube.y{background:var(--yellow); box-shadow:0 2px 0 #d6a800; animation-direction:reverse}
@keyframes spin{to{transform:rotate(380deg)}}
p.sub{margin:18px 0 24px; color:var(--muted); text-align:center; font-size:.95rem; font-weight:600}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(10px,3vw,22px); width:100%; max-width:540px}
.box{aspect-ratio:1; border:0; background:none; padding:0; cursor:pointer; position:relative}
.gift{position:absolute; inset:0; border-radius:18px;
  background:
   linear-gradient(var(--yellow),var(--yellow)) center/16% 100% no-repeat,
   linear-gradient(var(--yellow),var(--yellow)) center/100% 16% no-repeat,
   linear-gradient(145deg,var(--pink),var(--pink2));
  box-shadow:0 8px 0 #d6428a,0 12px 18px var(--shadow);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(1.8rem,9vw,3rem); font-weight:800; color:#fff;
  animation:bob 2.2s ease-in-out infinite; transition:transform .15s}
.gift span{background:var(--blue); width:42%; aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 #2b7dc0; transform:rotate(-8deg)}
.box:nth-child(2n) .gift{animation-delay:.3s}
.box:nth-child(3n) .gift{animation-delay:.6s}
.box:last-child:nth-child(3n+1){grid-column:2}
.box:hover .gift{transform:scale(1.07) rotate(-2deg)}
.box:active .gift{transform:scale(.95)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}

/* overlay */
#ov{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
  background:rgba(60,10,40,.72); backdrop-filter:blur(4px); padding:16px}
#ov.on{display:flex}
#fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.flash.go{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.stage{position:relative; width:min(86vw,360px); aspect-ratio:3/4; display:flex; align-items:center; justify-content:center}
.big{position:absolute; width:78%; aspect-ratio:1; border-radius:24px;
  background:
   linear-gradient(var(--yellow),var(--yellow)) center/16% 100% no-repeat,
   linear-gradient(var(--yellow),var(--yellow)) center/100% 16% no-repeat,
   linear-gradient(145deg,var(--pink),var(--pink2));
  box-shadow:0 0 50px var(--pink2); display:flex; align-items:center; justify-content:center;
  font-size:4rem; font-weight:800; color:#fff; animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.big.shake{animation:shake .12s linear infinite}
.big.gone{animation:vanish .35s ease-in forwards}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes shake{0%{transform:rotate(-6deg) scale(1.04)}50%{transform:rotate(6deg) scale(1.08)}100%{transform:rotate(-6deg) scale(1.04)}}
@keyframes vanish{to{transform:scale(1.8) rotate(10deg); opacity:0}}
.result{position:absolute; inset:0; background:var(--card); border:4px solid var(--pink); border-radius:24px;
  box-shadow:0 0 0 6px var(--yellow),0 0 60px var(--pink2);
  display:none; flex-direction:column; align-items:center; gap:10px; padding:14px; text-align:center}
.result.show{display:flex; animation:boom .7s cubic-bezier(.2,1.7,.4,1) both}
@keyframes boom{0%{transform:scale(.1) rotate(-25deg); opacity:0}100%{transform:scale(1) rotate(0); opacity:1}}
.badge{font-weight:800; color:var(--pink2); font-size:.85rem; letter-spacing:2px}
.photo{flex:1; width:100%; min-height:0; border:3px dashed var(--border); border-radius:14px;
  display:flex; align-items:center; justify-content:center; color:var(--muted); overflow:hidden}
.photo img{width:100%; height:100%; object-fit:cover; object-position:center 20%}
.name{font-size:1.4rem; font-weight:800; min-height:1.5em; word-break:break-word}
.close{border:0; border-radius:999px; padding:9px 24px; font-weight:700; font-size:1rem; color:#fff; cursor:pointer;
  background:linear-gradient(90deg,var(--pink),var(--pink2)); box-shadow:0 4px 0 #d6428a}
.close:active{transform:translateY(3px); box-shadow:0 1px 0 #d6428a}
#mute{position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); right:12px; z-index:30; border:0; width:42px; height:42px;
  border-radius:50%; background:var(--card); font-size:1.2rem; cursor:pointer; box-shadow:0 3px 8px var(--shadow)}
@media (prefers-reduced-motion: reduce){.gift,.cube,.big.shake{animation:none}}

.player{width:100%;max-width:540px;margin-bottom:22px;text-align:center}
.player input{width:100%;padding:13px 18px;border-radius:999px;border:3px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:700;text-align:center;font-size:1rem;outline:none}
.player input:focus{border-color:var(--pink2);box-shadow:0 0 0 4px var(--shadow)}
.msg{min-height:1.4em;margin-top:8px;font-size:.85rem;font-weight:700;color:var(--muted)}
.msg.bad{color:#e0245e}
.box.locked .gift{filter:grayscale(.6);opacity:.55;animation:none}
.nudge{animation:nud .35s}
@keyframes nud{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hist{width:100%;max-width:540px;margin-top:34px}
.hist h2{margin:0 0 6px;font-size:1.2rem;text-align:center}
.mode{text-align:center;font-size:.75rem;color:var(--muted);margin-bottom:12px}
#hl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#hl li{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:8px 12px}
#hl img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:center 20%;flex:none}
#hl .who{font-weight:800;min-width:0;word-break:break-word}
#hl .got{margin-left:auto;text-align:right;font-weight:700;color:var(--pink2);word-break:break-word}
#hl li.empty{justify-content:center;color:var(--muted);border-style:dashed}
</style>
</head>

<button id="mute" aria-label="Suara">🔊</button>
<h1><span class="cube"></span>Gacha Waifu mu<span class="cube y"></span></h1>
<p class="sub">Isi namamu dulu, lalu pilih satu kotak. Satu nama cuma sekali main! 🎸</p>
<div class="player"><input id="nm" maxlength="20" placeholder="Tulis namamu di sini…" autocomplete="off"><div id="msg" class="msg"></div></div>
<div class="grid" id="grid"></div>

<section class="hist"><h2>📜 Riwayat Gacha</h2><div class="mode" id="mode"></div><ul id="hl"></ul></section>

<div id="ov">

  <div class="stage" id="stage">
    <div class="big" id="big">?</div>

      <div class="badge">✨ KAMU DAPAT ✨</div>
      <div class="photo" id="photo">Foto</div>
      <div class="name" id="name"></div>
      <button class="close" id="close">Tutup</button>
    </div>
  </div>
</div>
