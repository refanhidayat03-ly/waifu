<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gacha Waifu mu</title>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#ffd9ea; --dot:#ffc0dc; --text:#7a1f4d; --muted:#b0577f;
  --pink:#ff8cc2; --pink2:#ff5fa8; --blue:#4aa8f0; --yellow:#ffd84d;
  --card:#fff; --border:#ff9fcb; --shadow:rgba(255,95,168,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#2b1224; --dot:#3a1830; --text:#ffd6ea; --muted:#d08fb0;
    --pink:#e0629f; --pink2:#c43f84; --card:#3a1b31; --border:#a8467a; --shadow:rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#2b1224; --dot:#3a1830; --text:#ffd6ea; --muted:#d08fb0;
  --pink:#e0629f; --pink2:#c43f84; --card:#3a1b31; --border:#a8467a; --shadow:rgba(0,0,0,.5);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Poppins","Segoe UI",system-ui,sans-serif;
  background:radial-gradient(var(--dot) 18%,transparent 19%) 0 0/28px 28px, var(--bg);
  display:flex; flex-direction:column; align-items:center; padding:26px 16px 40px;
}
h1{margin:0; font-size:clamp(1.8rem,7vw,2.9rem); text-align:center; color:#fff;
  -webkit-text-stroke:0; text-shadow:0 3px 0 var(--pink2),0 6px 0 var(--pink2),0 10px 14px var(--shadow);
  letter-spacing:1px}
.cube{display:inline-block; width:.55em; height:.55em; background:var(--blue); border-radius:4px;
  transform:rotate(20deg); margin:0 8px; box-shadow:0 2px 0 #2b7dc0; vertical-align:middle; animation:spin 4s linear infinite}
.cube.y{background:var(--yellow); box-shadow:0 2px 0 #d6a800; animation-direction:reverse}
@keyframes spin{to{transform:rotate(380deg)}}
p.sub{margin:18px 0 24px; color:var(--muted); text-align:center; font-size:.95rem; font-weight:600}
.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:clamp(10px,3vw,22px); width:100%; max-width:540px}
.box{aspect-ratio:1; border:0; background:none; padding:0; cursor:pointer; position:relative}
.gift{position:absolute; inset:0; border-radius:18px;
  background:
   linear-gradient(var(--yellow),var(--yellow)) center/16% 100% no-repeat,
   linear-gradient(var(--yellow),var(--yellow)) center/100% 16% no-repeat,
   linear-gradient(145deg,var(--pink),var(--pink2));
  box-shadow:0 8px 0 #d6428a,0 12px 18px var(--shadow);
  display:flex; align-items:center; justify-content:center;
  font-size:clamp(1.8rem,9vw,3rem); font-weight:800; color:#fff;
  animation:bob 2.2s ease-in-out infinite; transition:transform .15s}
.gift span{background:var(--blue); width:42%; aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 0 #2b7dc0; transform:rotate(-8deg)}
.box:nth-child(2n) .gift{animation-delay:.3s}
.box:nth-child(3n) .gift{animation-delay:.6s}
.box:last-child:nth-child(3n+1){grid-column:2}
.box:hover .gift{transform:scale(1.07) rotate(-2deg)}
.box:active .gift{transform:scale(.95)}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -6px}}

/* overlay */
#ov{position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
  background:rgba(60,10,40,.72); backdrop-filter:blur(4px); padding:16px}
#ov.on{display:flex}
#fx{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none}
.flash.go{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.stage{position:relative; width:min(86vw,360px); aspect-ratio:3/4; display:flex; align-items:center; justify-content:center}
.big{position:absolute; width:78%; aspect-ratio:1; border-radius:24px;
  background:
   linear-gradient(var(--yellow),var(--yellow)) center/16% 100% no-repeat,
   linear-gradient(var(--yellow),var(--yellow)) center/100% 16% no-repeat,
   linear-gradient(145deg,var(--pink),var(--pink2));
  box-shadow:0 0 50px var(--pink2); display:flex; align-items:center; justify-content:center;
  font-size:4rem; font-weight:800; color:#fff; animation:pop .4s cubic-bezier(.3,1.6,.5,1) both}
.big.shake{animation:shake .12s linear infinite}
.big.gone{animation:vanish .35s ease-in forwards}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes shake{0%{transform:rotate(-6deg) scale(1.04)}50%{transform:rotate(6deg) scale(1.08)}100%{transform:rotate(-6deg) scale(1.04)}}
@keyframes vanish{to{transform:scale(1.8) rotate(10deg); opacity:0}}
.result{position:absolute; inset:0; background:var(--card); border:4px solid var(--pink); border-radius:24px;
  box-shadow:0 0 0 6px var(--yellow),0 0 60px var(--pink2);
  display:none; flex-direction:column; align-items:center; gap:10px; padding:14px; text-align:center}
.result.show{display:flex; animation:boom .7s cubic-bezier(.2,1.7,.4,1) both}
@keyframes boom{0%{transform:scale(.1) rotate(-25deg); opacity:0}100%{transform:scale(1) rotate(0); opacity:1}}
.badge{font-weight:800; color:var(--pink2); font-size:.85rem; letter-spacing:2px}
.photo{flex:1; width:100%; min-height:0; border:3px dashed var(--border); border-radius:14px;
  display:flex; align-items:center; justify-content:center; color:var(--muted); overflow:hidden}
.photo img{width:100%; height:100%; object-fit:cover; object-position:center 20%}
.name{font-size:1.4rem; font-weight:800; min-height:1.5em; word-break:break-word}
.close{border:0; border-radius:999px; padding:9px 24px; font-weight:700; font-size:1rem; color:#fff; cursor:pointer;
  background:linear-gradient(90deg,var(--pink),var(--pink2)); box-shadow:0 4px 0 #d6428a}
.close:active{transform:translateY(3px); box-shadow:0 1px 0 #d6428a}
#mute{position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); right:12px; z-index:30; border:0; width:42px; height:42px;
  border-radius:50%; background:var(--card); font-size:1.2rem; cursor:pointer; box-shadow:0 3px 8px var(--shadow)}
@media (prefers-reduced-motion: reduce){.gift,.cube,.big.shake{animation:none}}

.player{width:100%;max-width:540px;margin-bottom:22px;text-align:center}
.player input{width:100%;padding:13px 18px;border-radius:999px;border:3px solid var(--border);background:var(--card);color:var(--text);font:inherit;font-weight:700;text-align:center;font-size:1rem;outline:none}
.player input:focus{border-color:var(--pink2);box-shadow:0 0 0 4px var(--shadow)}
.msg{min-height:1.4em;margin-top:8px;font-size:.85rem;font-weight:700;color:var(--muted)}
.msg.bad{color:#e0245e}
.box.locked .gift{filter:grayscale(.6);opacity:.55;animation:none}
.nudge{animation:nud .35s}
@keyframes nud{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.hist{width:100%;max-width:540px;margin-top:34px}
.hist h2{margin:0 0 6px;font-size:1.2rem;text-align:center}
.mode{text-align:center;font-size:.75rem;color:var(--muted);margin-bottom:12px}
#hl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
#hl li{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:8px 12px}
#hl img{width:42px;height:42px;border-radius:50%;object-fit:cover;object-position:center 20%;flex:none}
#hl .who{font-weight:800;min-width:0;word-break:break-word}
#hl .got{margin-left:auto;text-align:right;font-weight:700;color:var(--pink2);word-break:break-word}
#hl li.empty{justify-content:center;color:var(--muted);border-style:dashed}
</style>
</head>

<button id="mute" aria-label="Suara">🔊</button>
<h1><span class="cube"></span>Gacha Waifu mu<span class="cube y"></span></h1>
<p class="sub">Isi namamu dulu, lalu pilih satu kotak. Satu nama cuma sekali main! 🎸</p>
<div class="player"><input id="nm" maxlength="20" placeholder="Tulis namamu di sini…" autocomplete="off"><div id="msg" class="msg"></div></div>
<div class="grid" id="grid"></div>

<section class="hist"><h2>📜 Riwayat Gacha</h2><div class="mode" id="mode"></div><ul id="hl"></ul></section>

<div id="ov">

  <div class="stage" id="stage">
    <div class="big" id="big">?</div>

      <div class="badge">✨ KAMU DAPAT ✨</div>
      <div class="photo" id="photo">Foto</div>
      <div class="name" id="name"></div>
      <button class="close" id="close">Tutup</button>
    </div>
  </div>
</div>

/* ---------- Riwayat & nama ---------- */
// Isi dengan URL Firebase Realtime Database supaya riwayat dilihat semua pemain.
// Contoh: "https://nama-project-default-rtdb.firebaseio.com"  (kosong = riwayat hanya di perangkat ini)
const DB_URL = "";
const LKEY = "gw_history_v1";
let history = [], memHist = [], modeText = "", chosen = 0;
const nm = $("nm"), msg = $("msg");
const key = n => n.trim().toLowerCase().replace(/[.$#\[\]\/\s]+/g, "_").slice(0, 30);
const base = () => DB_URL.replace(/\/$/, "");
function lsGet(){ try { const v = JSON.parse(localStorage.getItem(LKEY) || "[]"); return Array.isArray(v) ? v : []; } catch(e){ return memHist; } }
function lsSet(a){ memHist = a; try { localStorage.setItem(LKEY, JSON.stringify(a)); } catch(e){} }

async function loadHistory(){
  try {
    if (DB_URL) {
      const r = await fetch(base() + "/history.json", {cache: "no-store"});
      if (!r.ok) throw new Error("http");
      const o = (await r.json()) || {};
      history = Object.keys(o).map(k => o[k]).filter(x => x && typeof x.name === "string" && Number.isInteger(x.w));
      modeText = "🌐 Riwayat online: semua pemain bisa melihatnya";
    } else {
      history = lsGet();
      modeText = "📱 Riwayat baru tersimpan di perangkat ini (belum tersambung database)";
    }
  } catch(e){
    modeText = "⚠️ Belum bisa terhubung ke database, coba lagi nanti";
  }
  history.sort((a, b) => (b.t || 0) - (a.t || 0));
  renderHistory(); refreshLock();
}
function renderHistory(){
  const ul = $("hl"); ul.textContent = "";
  $("mode").textContent = modeText;
  if (!history.length) {
    const li = document.createElement("li"); li.className = "empty"; li.textContent = "Belum ada yang main. Jadilah yang pertama! 😹"; ul.appendChild(li); return;
  }
  history.slice(0, 100).forEach(h => {
    const w = WAIFU[h.w]; if (!w) return;
    const li = document.createElement("li");
    const im = document.createElement("img"); im.alt = ""; im.src = w.img;
    const a = document.createElement("span"); a.className = "who"; a.textContent = h.name;
    const b = document.createElement("span"); b.className = "got"; b.textContent = w.name;
    li.append(im, a, b); ul.appendChild(li);
  });
}
async function saveEntry(name, w){
  const e = {name: name.trim(), w: w, t: Date.now()};
  if (DB_URL) {
    try {
      const r = await fetch(base() + "/history/" + encodeURIComponent(key(name)) + ".json", {method: "PUT", body: JSON.stringify(e)});
      if (r.status === 401 || r.status === 403) return "taken";
      if (!r.ok) return "error";
    } catch(x){ return "error"; }
  } else {
    const cur = lsGet();
    if (cur.some(h => key(h.name) === key(name))) return "taken";
    cur.push(e); lsSet(cur);
  }
  return "ok";
}
function nameState(){
  const n = nm.value.trim();
  if (n.length < 2) return "short";
  return history.some(h => key(h.name) === key(n)) ? "taken" : "ok";
}
function refreshLock(){
  const st = nameState();
  document.querySelectorAll(".box").forEach(b => b.classList.toggle("locked", st !== "ok"));
  msg.className = "msg" + (st === "taken" ? " bad" : "");
  msg.textContent = st === "ok" ? "Siap! Pilih satu kotak 🎁" : st === "taken" ? "Nama ini sudah pernah main 😹 pakai nama lain ya" : "Tulis namamu dulu (minimal 2 huruf)";
}
nm.addEventListener("input", refreshLock);
loadHistory();
if (DB_URL) setInterval(() => { if (!document.hidden && !busy) loadHistory(); }, 6000);

/* ---------- SFX (WebAudio) ---------- */
function audio(){
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
  if (ac && ac.state === "suspended") ac.resume();
  return ac;
}
function tone(f, t0, dur, type, vol){
  if (muted || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "triangle"; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, ac.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol || .2, ac.currentTime + t0 + .02);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + dur + .05);
}
function noise(t0, dur, vol){
  if (muted || !ac) return;
  const n = ac.sampleRate * dur, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = ac.createBufferSource(), g = ac.createGain();
  g.gain.value = vol || .3; s.buffer = buf; s.connect(g); g.connect(ac.destination);
  s.start(ac.currentTime + t0);
}
function sfxShake(){ for (let i = 0; i < 9; i++) tone(180 + i * 40, i * .1, .08, "square", .08); }
function sfxBoom(){
  noise(0, .5, .35); tone(90, 0, .4, "sine", .4);
  [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .05 + i * .08, .35, "triangle", .22));
  [1568, 2093, 2637].forEach((f, i) => tone(f, .45 + i * .09, .25, "sine", .12));
  tone(1047, .55, .7, "triangle", .2); tone(1319, .55, .7, "triangle", .15); tone(1568, .55, .7, "triangle", .15);
}

/* ---------- Confetti ---------- */
const cv = $("fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function sizeCv(){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
function confetti(){
  sizeCv();
  const colors = ["#ff5fa8","#ff8cc2","#ffd84d","#4aa8f0","#ffffff","#b388ff"];
  const W = cv.width, H = cv.height, dp = devicePixelRatio;
  for (let i = 0; i < 160; i++) {
    const a = Math.random() * Math.PI * 2, sp = (4 + Math.random() * 12) * dp;
    parts.push({x: W/2, y: H/2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6 * dp,
      s: (5 + Math.random() * 7) * dp, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
      c: colors[i % colors.length], life: 1, star: Math.random() < .25});
  }
  cancelAnimationFrame(raf); loop();
}
function loop(){
  cx.clearRect(0, 0, cv.width, cv.height);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += .35 * devicePixelRatio; p.vx *= .99; p.r += p.vr; p.life -= .006;
    cx.save(); cx.globalAlpha = Math.max(p.life, 0); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c;
    if (p.star) { cx.font = p.s * 2 + "px sans-serif"; cx.fillText("✦", 0, 0); } else cx.fillRect(-p.s/2, -p.s/2, p.s, p.s * .6);
    cx.restore();
  });
  parts = parts.filter(p => p.life > 0 && p.y < cv.height + 50);
  if (parts.length) raf = requestAnimationFrame(loop); else cx.clearRect(0, 0, cv.width, cv.height);
}

/* ---------- Alur gacha ---------- */
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
async function start(){
  if (busy) return;
  audio();
  if (nameState() !== "ok") {
    refreshLock(); nm.classList.remove("nudge"); void nm.offsetWidth; nm.classList.add("nudge"); nm.focus(); return;
  }
  busy = true;
  await loadHistory();
  if (nameState() !== "ok") { busy = false; return; }
  chosen = Math.floor(Math.random() * WAIFU.length);
  const r = await saveEntry(nm.value, chosen);
  if (r !== "ok") {
    busy = false;
    if (r === "taken") { await loadHistory(); } else { msg.className = "msg bad"; msg.textContent = "Gagal menyimpan, coba lagi ya"; }
    return;
  }
  loadHistory();
  ov.classList.add("on");
  res.classList.remove("show"); big.className = "big"; big.style.display = "flex";
  later(() => { big.classList.add("shake"); sfxShake(); }, 450);
  later(reveal, 1500);
}
function reveal(){
  big.className = "big gone";
  const f = $("flash"); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
  const pick = WAIFU[chosen] || {name: "", img: ""};
  const ph = $("photo");
  ph.textContent = "Foto";
  if (pick.img) { const im = new Image(); im.alt = ""; im.src = pick.img; ph.textContent = ""; ph.appendChild(im); }
  $("name").textContent = pick.name || "Nama Waifu";
  sfxBoom(); confetti();
  if (navigator.vibrate) { try { navigator.vibrate([60, 40, 120]); } catch(e){} }
  later(() => { big.style.display = "none"; res.classList.add("show"); }, 200);
}
function closeIt(){
  timers.forEach(clearTimeout); timers = [];
  ov.classList.remove("on"); res.classList.remove("show"); parts = []; busy = false; loadHistory();
}
$("close").addEventListener("click", closeIt);
ov.addEventListener("click", e => { if (e.target === ov && res.classList.contains("show")) closeIt(); });
$("mute").addEventListener("click", e => { muted = !muted; e.currentTarget.textContent = muted ? "🔇" : "🔊"; });
addEventListener("resize", () => { if (ov.classList.contains("on")) sizeCv(); });
</script>
